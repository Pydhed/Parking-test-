<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ассистент Парковки</title>
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Парковка">

    <link rel="icon" type="image/png" href="logo-gradient.png">
    <link rel="apple-touch-icon" href="logo-gradient.png">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            user-select: none;
        }
        
        /* Анимация выезда машинки снизу */
        @keyframes driveInFromBottom {
            0% { 
                transform: translateY(180px);
                opacity: 0;
            }
            15% {
                opacity: 1;
            }
            100% { 
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        /* Свечение фар во время движения */
        @keyframes headlightsOn {
            0%, 85% {
                filter: drop-shadow(0 0 8px #fef08a) drop-shadow(0 0 15px #fef08a);
            }
            100% {
                filter: drop-shadow(0 0 2px #fef08a);
            }
        }
        
        /* Свечение задних габаритов */
        @keyframes taillightsOn {
            0%, 85% {
                filter: drop-shadow(0 0 6px #ef4444) drop-shadow(0 0 12px #ef4444);
            }
            100% {
                filter: drop-shadow(0 0 1px #ef4444);
            }
        }
        
        .car-animate {
            animation: driveInFromBottom 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            opacity: 0;
        }
        
        .headlights-animate {
            animation: headlightsOn 1.2s ease-out forwards;
        }
        
        .taillights-animate {
            animation: taillightsOn 1.2s ease-out forwards;
        }
        
        /* Красивая анимация текста */
        @keyframes textSlideIn {
            0% { 
                opacity: 0;
                transform: translateY(-15px) scale(0.9);
            }
            60% {
                transform: translateY(3px) scale(1.05);
            }
            100% { 
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .text-pop {
            animation: textSlideIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 1s forwards;
            opacity: 0;
        }
        
        /* Анимация иконок */
        @keyframes iconBounce {
            0% { 
                transform: scale(0) rotate(-180deg);
                opacity: 0;
            }
            60% { 
                transform: scale(1.3) rotate(10deg);
                opacity: 1;
            }
            80% {
                transform: scale(0.9) rotate(-5deg);
            }
            100% { 
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }
        .icon-pop {
            animation: iconBounce 0.7s cubic-bezier(0.68, -0.55, 0.265, 1.55) 0.9s forwards;
            opacity: 0;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 h-screen w-full flex flex-col font-sans overflow-hidden relative">

    <main class="flex-1 flex flex-col items-center pt-4 px-4 w-full max-w-md mx-auto relative z-10">
        
        <!-- Время -->
        <div id="current-datetime" class="text-center text-slate-300 font-medium text-sm mb-3 bg-slate-800/50 py-1.5 px-4 rounded-full border border-slate-700 shadow-md whitespace-nowrap">
            Загрузка...
        </div>

        <h1 class="text-2xl font-extrabold text-white tracking-tight text-center mb-3 drop-shadow-md">
            Нагорное шоссе
        </h1>

        <!-- Краткий вердикт -->
        <div class="w-full bg-slate-800/60 p-3 rounded-xl border border-slate-700 mb-3 text-center shadow-lg">
            <p id="verdict-text" class="text-base text-white font-semibold leading-snug"></p>
        </div>

        <!-- Таймер -->
        <div id="timer-container" class="w-full bg-slate-800/60 p-2 rounded-xl border border-slate-700 mb-3 text-center">
            <div id="timer-title" class="text-[10px] text-slate-400 uppercase tracking-widest font-bold mb-0.5">...</div>
            <div id="timer-value" class="text-2xl font-mono font-bold text-amber-400 drop-shadow-sm">--:--:--</div>
        </div>

        <!-- Схема дороги -->
        <div class="w-full h-96 bg-slate-600 rounded-3xl border-4 border-slate-500 flex relative shadow-2xl mb-3 overflow-visible">
            <!-- Разделительная полоса -->
            <div class="absolute top-0 bottom-0 left-1/2 w-2 -ml-[4px] border-l-[8px] border-dashed border-slate-300 opacity-60 z-10 rounded-full"></div>
            
            <!-- Левая сторона -->
            <div id="left-lane" class="flex-1 flex flex-col items-center justify-center relative bg-slate-800/80 transition-all duration-500 border-t-4 border-transparent rounded-tl-2xl overflow-visible">
                <div class="absolute top-2 text-slate-300 text-[10px] uppercase font-bold tracking-widest text-center z-20">Слева<br><span class="text-[9px] text-slate-400">(I)</span></div>
                <div id="left-road-content" class="w-full h-full flex flex-col items-center justify-center relative pt-6"></div>
            </div>

            <!-- Правая сторона -->
            <div id="right-lane" class="flex-1 flex flex-col items-center justify-center relative bg-slate-800/80 transition-all duration-500 border-t-4 border-transparent rounded-tr-2xl overflow-visible">
                <div class="absolute top-2 text-slate-300 text-[10px] uppercase font-bold tracking-widest text-center z-20">Справа<br><span class="text-[9px] text-slate-400">(II)</span></div>
                <div id="right-road-content" class="w-full h-full flex flex-col items-center justify-center relative pt-6"></div>
            </div>
        </div>
    </main>

    <!-- Кнопка Обновить -->
    <div class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-md pb-4 pt-2 px-4 border-t border-slate-800 z-20 flex justify-center">
        <button onclick="window.location.reload()" class="w-full max-w-md bg-slate-700 hover:bg-slate-600 active:bg-slate-800 text-white text-lg font-bold py-3 rounded-xl shadow-lg active:scale-[0.98] transition-all flex items-center justify-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
            </svg>
            Обновить
        </button>
    </div>

    <script>
        // SVG машинки с анимацией свечения фар и габаритов
        const carSVG = `
            <div class="car-animate">
                <svg viewBox="0 0 100 200" class="w-16 h-32 drop-shadow-xl">
                    <rect x="15" y="10" width="70" height="180" rx="25" fill="#f8fafc"/>
                    <rect x="20" y="40" width="60" height="35" fill="#0f172a" rx="5"/>
                    <rect x="20" y="130" width="60" height="40" fill="#0f172a" rx="5"/>
                    <!-- Фары с анимацией свечения -->
                    <circle cx="25" cy="20" r="5" fill="#fef08a" class="headlights-animate"/>
                    <circle cx="75" cy="20" r="5" fill="#fef08a" class="headlights-animate"/>
                    <!-- Задние габариты с анимацией свечения -->
                    <rect x="20" y="180" width="15" height="5" fill="#ef4444" rx="2" class="taillights-animate"/>
                    <rect x="65" y="180" width="15" height="5" fill="#ef4444" rx="2" class="taillights-animate"/>
                </svg>
            </div>
        `;

        const carSVGDelayed = `
            <div class="car-animate" style="animation-delay: 0.3s;">
                <svg viewBox="0 0 100 200" class="w-16 h-32 drop-shadow-xl">
                    <rect x="15" y="10" width="70" height="180" rx="25" fill="#f8fafc"/>
                    <rect x="20" y="40" width="60" height="35" fill="#0f172a" rx="5"/>
                    <rect x="20" y="130" width="60" height="40" fill="#0f172a" rx="5"/>
                    <!-- Фары с анимацией свечения -->
                    <circle cx="25" cy="20" r="5" fill="#fef08a" class="headlights-animate" style="animation-delay: 0.3s;"/>
                    <circle cx="75" cy="20" r="5" fill="#fef08a" class="headlights-animate" style="animation-delay: 0.3s;"/>
                    <!-- Задние габариты с анимацией свечения -->
                    <rect x="20" y="180" width="15" height="5" fill="#ef4444" rx="2" class="taillights-animate" style="animation-delay: 0.3s;"/>
                    <rect x="65" y="180" width="15" height="5" fill="#ef4444" rx="2" class="taillights-animate" style="animation-delay: 0.3s;"/>
                </svg>
            </div>
        `;

        const iconOk = `
            <div class="bg-green-500/90 p-1.5 rounded-full shadow-[0_0_15px_rgba(34,197,94,0.8)] z-20 icon-pop mt-2">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M5 13l4 4L19 7"></path>
                </svg>
            </div>
        `;

        const iconCross = `
            <div class="bg-red-500/90 p-1.5 rounded-full shadow-[0_0_15px_rgba(239,68,68,0.8)] z-20 icon-pop mt-2">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </div>
        `;

        const iconWarning = `
            <div class="bg-yellow-500/90 p-1.5 rounded-full shadow-[0_0_15px_rgba(234,179,8,0.8)] z-20 icon-pop mt-2">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
            </div>
        `;

        function calculateLogic() {
            const now = new Date();
            const dateStr = now.toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'short' });
            const timeStr = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('current-datetime').textContent = `${dateStr} • ${timeStr}`;

            const hours = now.getHours();
            const isChangeover = (hours >= 21); 

            let tomorrow = new Date(now);
            tomorrow.setDate(tomorrow.getDate() + 1);
            let tomorrowOdd = (tomorrow.getDate() % 2 !== 0);
            
            const midnightParkLeft = !tomorrowOdd;
            const mode = isChangeover ? 'strict' : 'relaxed';

            let verdict = "";
            if (mode === 'strict') {
                verdict = midnightParkLeft ? 'Четное число → <span class="text-green-400">слева</span>' : 'Нечетное число → <span class="text-green-400">справа</span>';
            } else {
                verdict = 'До 21:00 — <span class="text-yellow-400">с обеих сторон</span>';
            }

            document.getElementById('verdict-text').innerHTML = verdict;
            return { mode, midnightParkLeft };
        }

        function drawRoad({ mode, midnightParkLeft }) {
            const leftContainer = document.getElementById('left-road-content');
            const rightContainer = document.getElementById('right-road-content');
            const leftLane = document.getElementById('left-lane');
            const rightLane = document.getElementById('right-lane');
            
            leftContainer.innerHTML = '';
            rightContainer.innerHTML = '';
            leftLane.className = "flex-1 flex flex-col items-center justify-center relative bg-slate-800/80 transition-all duration-500 border-t-4 border-transparent rounded-tl-2xl overflow-visible";
            rightLane.className = "flex-1 flex flex-col items-center justify-center relative bg-slate-800/80 transition-all duration-500 border-t-4 border-transparent rounded-tr-2xl overflow-visible";

            if (mode === 'strict') {
                if (midnightParkLeft) {
                    leftContainer.innerHTML = `
                        <div class="text-pop text-xs text-green-400 font-bold text-center mb-2 bg-slate-900/80 px-2 py-1 rounded shadow-lg">
                            Можно до 00:00
                        </div>
                        ${carSVG}
                        ${iconOk}
                    `;
                    rightContainer.innerHTML = `
                        <div class="text-pop text-xs text-red-400 font-bold text-center mb-2 bg-slate-900/80 px-2 py-1 rounded shadow-lg">
                            Нельзя
                        </div>
                        ${iconCross}
                    `;
                    leftLane.classList.add('border-green-500/60', 'bg-slate-800');
                    rightLane.classList.add('opacity-50');
                } else {
                    leftContainer.innerHTML = `
                        <div class="text-pop text-xs text-red-400 font-bold text-center mb-2 bg-slate-900/80 px-2 py-1 rounded shadow-lg">
                            Нельзя
                        </div>
                        ${iconCross}
                    `;
                    rightContainer.innerHTML = `
                        <div class="text-pop text-xs text-green-400 font-bold text-center mb-2 bg-slate-900/80 px-2 py-1 rounded shadow-lg">
                            Можно до 00:00
                        </div>
                        ${carSVG}
                        ${iconOk}
                    `;
                    rightLane.classList.add('border-green-500/60', 'bg-slate-800');
                    leftLane.classList.add('opacity-50');
                }
            } else {
                if (midnightParkLeft) {
                    leftContainer.innerHTML = `
                        <div class="text-pop text-xs text-green-400 font-bold text-center mb-2 bg-slate-900/80 px-2 py-1 rounded shadow-lg">
                            Останется после 00:00
                        </div>
                        ${carSVG}
                        ${iconOk}
                    `;
                    rightContainer.innerHTML = `
                        <div class="text-pop text-xs text-yellow-400 font-bold text-center mb-2 bg-slate-900/80 px-2 py-1 rounded shadow-lg">
                            Убрать до 21:00
                        </div>
                        ${carSVGDelayed}
                        ${iconWarning}
                    `;
                    leftLane.classList.add('border-green-500/60');
                    rightLane.classList.add('border-yellow-500/40');
                } else {
                    leftContainer.innerHTML = `
                        <div class="text-pop text-xs text-yellow-400 font-bold text-center mb-2 bg-slate-900/80 px-2 py-1 rounded shadow-lg">
                            Убрать до 21:00
                        </div>
                        ${carSVGDelayed}
                        ${iconWarning}
                    `;
                    rightContainer.innerHTML = `
                        <div class="text-pop text-xs text-green-400 font-bold text-center mb-2 bg-slate-900/80 px-2 py-1 rounded shadow-lg">
                            Останется после 00:00
                        </div>
                        ${carSVG}
                        ${iconOk}
                    `;
                    rightLane.classList.add('border-green-500/60');
                    leftLane.classList.add('border-yellow-500/40');
                }
            }
        }

        function updateTimerLive() {
            const now = new Date();
            let target = new Date(now);
            const isChangeover = now.getHours() >= 21;

            if (isChangeover) {
                target.setDate(target.getDate() + 1);
                target.setHours(0, 0, 0, 0);
                document.getElementById('timer-title').textContent = "До 00:00:";
                document.getElementById('timer-value').className = "text-2xl font-mono font-bold text-red-400 drop-shadow-sm";
            } else {
                target.setHours(21, 0, 0, 0);
                document.getElementById('timer-title').textContent = "До 21:00:";
                document.getElementById('timer-value').className = "text-2xl font-mono font-bold text-amber-400 drop-shadow-sm";
            }

            let diff = target - now;
            if (diff < 0) diff = 0;

            const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const m = Math.floor((diff / 1000 / 60) % 60);
            const s = Math.floor((diff / 1000) % 60);

            document.getElementById('timer-value').textContent = 
                `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        let lastMode = null;
        let lastMidnightParkLeft = null;

        function tick() {
            const logic = calculateLogic();
            updateTimerLive();
            
            if (lastMode !== logic.mode || lastMidnightParkLeft !== logic.midnightParkLeft) {
                drawRoad(logic);
                lastMode = logic.mode;
                lastMidnightParkLeft = logic.midnightParkLeft;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            tick();
            setInterval(tick, 1000);
        });

        // PWA
        const manifestData = {
            "name": "Ассистент Парковки",
            "short_name": "Парковка",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#0f172a",
            "theme_color": "#0f172a",
            "icons": [{"src": "logo-gradient.png", "sizes": "192x192 512x512", "type": "image/png", "purpose": "any maskable"}]
        };
        const manifestBlob = new Blob([JSON.stringify(manifestData)], {type: 'application/json'});
        const manifestLink = document.createElement('link');
        manifestLink.rel = 'manifest';
        manifestLink.href = URL.createObjectURL(manifestBlob);
        document.head.appendChild(manifestLink);

        const swCode = `
            const CACHE_NAME = 'parking-v8';
            self.addEventListener('install', e => { self.skipWaiting(); });
            self.addEventListener('activate', e => { self.clients.claim(); });
            self.addEventListener('fetch', e => {
                e.respondWith(fetch(e.request).catch(() => new Response('Offline')));
            });
        `;
        const swBlob = new Blob([swCode], {type: 'application/javascript'});
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
        }
    </script>
</body>
</html>
