<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ассистент Парковки</title>
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Парковка">

    <link rel="icon" type="image/png" href="logo-gradient.png">
    <link rel="apple-touch-icon" href="logo-gradient.png">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            user-select: none;
        }
        
        /* Исправленная анимация выезда: меньше смещение, добавлен scale для плавности */
        @keyframes driveIn {
            0% { transform: translateY(40px) scale(0.8); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }
        .car-animate {
            animation: driveIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        
        /* Анимация появления иконок с задержкой */
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            60% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .icon-pop {
            animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.4s forwards;
            opacity: 0;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 h-screen w-full flex flex-col font-sans overflow-hidden relative">

    <main class="flex-1 flex flex-col items-center pt-6 px-4 w-full max-w-md mx-auto relative z-10 overflow-y-auto">
        
        <!-- Время -->
        <div id="current-datetime" class="text-center text-slate-300 font-medium text-base mb-4 bg-slate-800/50 py-2 px-5 rounded-full border border-slate-700 shadow-md whitespace-nowrap">
            Загрузка...
        </div>

        <h1 class="text-3xl font-extrabold text-white tracking-tight text-center mb-4 drop-shadow-md">
            Нагорное шоссе
        </h1>

        <!-- Вердикт -->
        <div class="w-full bg-slate-800/60 p-4 rounded-2xl border border-slate-700 mb-4 text-center shadow-lg">
            <p id="verdict-text" class="text-lg text-white font-medium leading-relaxed"></p>
        </div>

        <!-- Таймер -->
        <div id="timer-container" class="w-full bg-slate-800/60 p-3 rounded-2xl border border-slate-700 mb-6 text-center">
            <div id="timer-title" class="text-xs text-slate-400 uppercase tracking-widest font-bold mb-1">...</div>
            <div id="timer-value" class="text-3xl font-mono font-bold text-amber-400 drop-shadow-sm">--:--:--</div>
        </div>

        <!-- Схема дороги (увеличена высота до h-80 для предотвращения обрезки) -->
        <div class="w-full h-80 bg-slate-600 rounded-3xl border-4 border-slate-500 flex relative shadow-2xl mb-4">
            <!-- Разделительная полоса (с собственным overflow, чтобы не резать машинки) -->
            <div class="absolute top-0 bottom-0 left-1/2 w-2 -ml-[4px] border-l-[8px] border-dashed border-slate-300 opacity-60 z-10 rounded-full"></div>
            
            <!-- Левая сторона -->
            <div id="left-lane" class="flex-1 flex flex-col items-center justify-end relative bg-slate-800/80 pb-6 transition-all duration-500 border-t-4 border-transparent rounded-tl-2xl">
                <div class="absolute top-3 text-slate-300 text-xs uppercase font-bold tracking-widest text-center z-20">Слева<br><span class="text-[10px] text-slate-400">(I)</span></div>
                <div id="left-road-content" class="w-full h-full flex flex-col items-center justify-center relative"></div>
            </div>

            <!-- Правая сторона -->
            <div id="right-lane" class="flex-1 flex flex-col items-center justify-end relative bg-slate-800/80 pb-6 transition-all duration-500 border-t-4 border-transparent rounded-tr-2xl">
                <div class="absolute top-3 text-slate-300 text-xs uppercase font-bold tracking-widest text-center z-20">Справа<br><span class="text-[10px] text-slate-400">(II)</span></div>
                <div id="right-road-content" class="w-full h-full flex flex-col items-center justify-center relative"></div>
            </div>
        </div>
    </main>

    <!-- Кнопка Обновить -->
    <div class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-md pb-6 pt-3 px-4 border-t border-slate-800 z-20 flex justify-center">
        <button onclick="window.location.reload()" class="w-full max-w-md bg-slate-700 hover:bg-slate-600 active:bg-slate-800 text-white text-xl font-bold py-4 rounded-2xl shadow-lg active:scale-[0.98] transition-all flex items-center justify-center gap-3">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
            </svg>
            Обновить
        </button>
    </div>

    <script>
        // SVG машинки (чуть компактнее для идеального вписывания)
        const carSVG = `
            <svg viewBox="0 0 100 200" class="w-10 h-20 car-animate drop-shadow-xl absolute bottom-4 z-10">
                <rect x="15" y="10" width="70" height="180" rx="25" fill="#f8fafc"/>
                <rect x="20" y="40" width="60" height="35" fill="#0f172a" rx="5"/>
                <rect x="20" y="130" width="60" height="40" fill="#0f172a" rx="5"/>
                <circle cx="25" cy="20" r="5" fill="#fef08a"/>
                <circle cx="75" cy="20" r="5" fill="#fef08a"/>
                <rect x="20" y="180" width="15" height="5" fill="#ef4444" rx="2"/>
                <rect x="65" y="180" width="15" height="5" fill="#ef4444" rx="2"/>
            </svg>
        `;

        const carSVGDelayed = `
            <svg viewBox="0 0 100 200" class="w-10 h-20 car-animate drop-shadow-xl absolute bottom-4 z-10" style="animation-delay: 0.3s;">
                <rect x="15" y="10" width="70" height="180" rx="25" fill="#f8fafc"/>
                <rect x="20" y="40" width="60" height="35" fill="#0f172a" rx="5"/>
                <rect x="20" y="130" width="60" height="40" fill="#0f172a" rx="5"/>
                <circle cx="25" cy="20" r="5" fill="#fef08a"/>
                <circle cx="75" cy="20" r="5" fill="#fef08a"/>
                <rect x="20" y="180" width="15" height="5" fill="#ef4444" rx="2"/>
                <rect x="65" y="180" width="15" height="5" fill="#ef4444" rx="2"/>
            </svg>
        `;

        const iconOk = `
            <div class="bg-green-500/90 p-2 rounded-full shadow-[0_0_15px_rgba(34,197,94,0.8)] z-20 icon-pop mb-2">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M5 13l4 4L19 7"></path>
                </svg>
            </div>
        `;

        const iconCross = `
            <div class="bg-red-500/90 p-2 rounded-full shadow-[0_0_15px_rgba(239,68,68,0.8)] z-20 icon-pop mb-2">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </div>
        `;

        const iconWarning = `
            <div class="bg-yellow-500/90 p-2 rounded-full shadow-[0_0_15px_rgba(234,179,8,0.8)] z-20 icon-pop mb-2">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
            </div>
        `;

        function calculateLogic() {
            const now = new Date();
            const dateStr = now.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
            const timeStr = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('current-datetime').textContent = `${dateStr.charAt(0).toUpperCase() + dateStr.slice(1)} • ${timeStr}`;

            const hours = now.getHours();
            const isChangeover = (hours >= 21); 

            let tomorrow = new Date(now);
            tomorrow.setDate(tomorrow.getDate() + 1);
            let tomorrowOdd = (tomorrow.getDate() % 2 !== 0);
            
            // Если завтра четное, паркуемся слева (true). Если нечетное, то справа (false).
            const midnightParkLeft = !tomorrowOdd;
            const mode = isChangeover ? 'strict' : 'relaxed';

            let verdict = "";
            if (mode === 'strict') {
                if (midnightParkLeft) {
                    verdict = 'Завтра четное число. Паркуемся только <span class="text-green-400 font-bold">слева</span>. Переставьте авто до 00:00!';
                } else {
                    verdict = 'Завтра нечетное число. Паркуемся только <span class="text-green-400 font-bold">справа</span>. Переставьте авто до 00:00!';
                }
            } else {
                if (midnightParkLeft) {
                    verdict = 'До 21:00 можно стоять с обеих сторон.<br>Но после полуночи парковка будет разрешена только <span class="text-green-400 font-bold">слева</span> (завтра четное).';
                } else {
                    verdict = 'До 21:00 можно стоять с обеих сторон.<br>Но после полуночи парковка будет разрешена только <span class="text-green-400 font-bold">справа</span> (завтра нечетное).';
                }
            }

            document.getElementById('verdict-text').innerHTML = verdict;
            return { mode, midnightParkLeft };
        }

        function drawRoad({ mode, midnightParkLeft }) {
            const leftContainer = document.getElementById('left-road-content');
            const rightContainer = document.getElementById('right-road-content');
            const leftLane = document.getElementById('left-lane');
            const rightLane = document.getElementById('right-lane');
            
            leftContainer.innerHTML = '';
            rightContainer.innerHTML = '';
            leftLane.className = "flex-1 flex flex-col items-center justify-end relative bg-slate-800/80 pb-6 transition-all duration-500 border-t-4 border-transparent rounded-tl-2xl";
            rightLane.className = "flex-1 flex flex-col items-center justify-end relative bg-slate-800/80 pb-6 transition-all duration-500 border-t-4 border-transparent rounded-tr-2xl";

            if (mode === 'strict') {
                if (midnightParkLeft) {
                    leftContainer.innerHTML = carSVG + iconOk + `<span class="text-xs text-green-400 font-bold mt-1">Паркуйся здесь</span>`;
                    rightContainer.innerHTML = iconCross + `<span class="text-xs text-red-400 font-bold mt-1">Не парковаться</span>`;
                    leftLane.classList.add('border-green-500/60', 'bg-slate-800');
                    rightLane.classList.add('opacity-50');
                } else {
                    leftContainer.innerHTML = iconCross + `<span class="text-xs text-red-400 font-bold mt-1">Не парковаться</span>`;
                    rightContainer.innerHTML = carSVG + iconOk + `<span class="text-xs text-green-400 font-bold mt-1">Паркуйся здесь</span>`;
                    rightLane.classList.add('border-green-500/60', 'bg-slate-800');
                    leftLane.classList.add('opacity-50');
                }
            } else {
                // Мягкий режим: машинки выезжают с обеих сторон
                if (midnightParkLeft) {
                    leftContainer.innerHTML = carSVG + iconOk + `<span class="text-xs text-green-400 font-bold mt-1">Останется после 00:00</span>`;
                    rightContainer.innerHTML = carSVGDelayed + iconWarning + `<span class="text-xs text-yellow-400 font-bold mt-1">Убрать до 21:00</span>`;
                    leftLane.classList.add('border-green-500/60');
                    rightLane.classList.add('border-yellow-500/40');
                } else {
                    leftContainer.innerHTML = carSVGDelayed + iconWarning + `<span class="text-xs text-yellow-400 font-bold mt-1">Убрать до 21:00</span>`;
                    rightContainer.innerHTML = carSVG + iconOk + `<span class="text-xs text-green-400 font-bold mt-1">Останется после 00:00</span>`;
                    rightLane.classList.add('border-green-500/60');
                    leftLane.classList.add('border-yellow-500/40');
                }
            }
        }

        function updateTimerLive() {
            const now = new Date();
            let target = new Date(now);
            const isChangeover = now.getHours() >= 21;

            if (isChangeover) {
                target.setDate(target.getDate() + 1);
                target.setHours(0, 0, 0, 0);
                document.getElementById('timer-title').textContent = "До смены правил (00:00) осталось:";
                document.getElementById('timer-value').className = "text-3xl font-mono font-bold text-red-400 drop-shadow-sm";
            } else {
                target.setHours(21, 0, 0, 0);
                document.getElementById('timer-title').textContent = "До начала перепарковки (21:00) осталось:";
                document.getElementById('timer-value').className = "text-3xl font-mono font-bold text-amber-400 drop-shadow-sm";
            }

            let diff = target - now;
            if (diff < 0) diff = 0;

            const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const m = Math.floor((diff / 1000 / 60) % 60);
            const s = Math.floor((diff / 1000) % 60);

            document.getElementById('timer-value').textContent = 
                `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        // Храним последнее состояние, чтобы не перезапускать анимацию каждую секунду
        let lastMode = null;
        let lastMidnightParkLeft = null;

        function tick() {
            const logic = calculateLogic();
            updateTimerLive();
            
            // Перерисовываем дорогу ТОЛЬКО если изменились условия (например, пробило 21:00)
            if (lastMode !== logic.mode || lastMidnightParkLeft !== logic.midnightParkLeft) {
                drawRoad(logic);
                lastMode = logic.mode;
                lastMidnightParkLeft = logic.midnightParkLeft;
            }
        }

        // Запуск при загрузке страницы
        window.addEventListener('DOMContentLoaded', () => {
            tick(); // Первый запуск отрисовки и таймера
            setInterval(tick, 1000); // Обновление каждую секунду
        });

        // PWA Манифест и Service Worker
        const manifestData = {
            "name": "Ассистент Парковки",
            "short_name": "Парковка",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#0f172a",
            "theme_color": "#0f172a",
            "icons": [{"src": "logo-gradient.png", "sizes": "192x192 512x512", "type": "image/png", "purpose": "any maskable"}]
        };
        const manifestBlob = new Blob([JSON.stringify(manifestData)], {type: 'application/json'});
        const manifestLink = document.createElement('link');
        manifestLink.rel = 'manifest';
        manifestLink.href = URL.createObjectURL(manifestBlob);
        document.head.appendChild(manifestLink);

        const swCode = `
            const CACHE_NAME = 'parking-v4';
            self.addEventListener('install', e => { self.skipWaiting(); });
            self.addEventListener('activate', e => { self.clients.claim(); });
            self.addEventListener('fetch', e => {
                e.respondWith(fetch(e.request).catch(() => new Response('Offline')));
            });
        `;
        const swBlob = new Blob([swCode], {type: 'application/javascript'});
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
        }
    </script>
</body>
</html>
